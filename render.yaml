services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: placement-test-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: ADMIN_SECRET
        sync: false          # Set manually in Render dashboard
      - key: NODE_ENV
        value: production

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: placement-test-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false          # Set to your API service URL e.g. https://placement-test-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
