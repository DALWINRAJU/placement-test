services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: placement-test-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node --no-warnings index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false

  # ── Frontend ─────────────────────────────────────────────────────────────
  - type: web
    name: placement-test-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html